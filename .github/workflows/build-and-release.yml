name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  # ── Lint & Security ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-mode: goinstall
          args: --build-tags=integration ./... ./integration/testdata/child

      - name: gosec security checker
        env:
          # renovate: datasource=go depName=github.com/securego/gosec/v2
          GOSEC_VERSION: v2.29.0
        run: go run "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" ./...

      - name: govulncheck
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.8.0
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -tags=integration -test ./... ./integration/testdata/child

  # ── Test ─────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Run tests
        run: go test -v -race -cover ./...

  # Run the OpenBao integration fixture for every workflow event and use it to
  # gate release publication.
  integration:
    name: OpenBao Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
    needs: [lint, test]
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Install pinned OpenBao
        shell: pwsh
        run: |
          ./integration/tools/install-openbao.ps1 -Destination "$env:RUNNER_TEMP/openbao"
          "$env:RUNNER_TEMP/openbao" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run native integration tests
        run: go test -tags=integration -count=1 -timeout=8m -v ./integration

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs: [lint, test]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Set binary name
        id: bin
        shell: bash
        run: |
          NAME="bao-wrapper-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            NAME="${NAME}.exe"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          go build -trimpath -buildvcs=false -mod=readonly \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o "${{ steps.bin.outputs.name }}" .

      - name: Generate SPDX SBOM from binary
        # The pinned action also pins its default Syft version.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_SOURCE_VERSION: ${{ steps.build.outputs.version }}
        with:
          file: ${{ steps.bin.outputs.name }}
          format: spdx-json
          output-file: ${{ steps.bin.outputs.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload binary and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bin.outputs.name }}
          path: |
            ${{ steps.bin.outputs.name }}
            ${{ steps.bin.outputs.name }}.spdx.json
          if-no-files-found: error

  # Bind each SBOM to its binary digest only after all release checks pass.
  attest-sbom:
    name: Attest SBOM (${{ matrix.binary }})
    runs-on: ubuntu-24.04
    needs: [build, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        binary:
          - bao-wrapper-linux-amd64
          - bao-wrapper-linux-arm64
          - bao-wrapper-windows-amd64.exe
          - bao-wrapper-darwin-amd64
          - bao-wrapper-darwin-arm64
    steps:
      - name: Download binary and SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.binary }}
          path: dist/

      - name: Attest binary SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ matrix.binary }}
          sbom-path: dist/${{ matrix.binary }}.spdx.json

  # ── Release ───────────────────────────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: [build, integration, attest-sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksum manifest
        run: sha256sum dist/* | sed 's#dist/##' > dist/SHA256SUMS

      - name: Attest release binaries, SBOMs and checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
