name: bao-wrapper-integration

services:
  openbao-data-init:
    image: ghcr.io/openbao/openbao:2.6.2
    user: "0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 100:1000 /openbao/data"]
    volumes:
      - openbao-data:/openbao/data

  openbao:
    image: ghcr.io/openbao/openbao:2.6.2
    command: server
    depends_on:
      openbao-data-init:
        condition: service_completed_successfully
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      OPENBAO_STATIC_SEAL_KEY: 0123456789abcdef0123456789abcdef
      INTEGRATION_ROLE_ID: 11111111-2222-3333-4444-555555555555
      INTEGRATION_SECRET_ID: bao-wrapper-integration-secret-id
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"
    volumes:
      - ./integration/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/data
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

volumes:
  openbao-data:
